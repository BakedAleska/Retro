[package]
name = "Retro"
version = "0.1.0"
edition = "2024"
default-run = "retro"

[lib]
name = "retro"
path = "src/lib.rs"

[[bin]]
name = "retro"
path = "src/main.rs"

[[bin]]
name = "snapshot"
path = "src/bin/snapshot.rs"

[[bench]]
name = "tick"
harness = false

[[bench]]
name = "audio_decode"
harness = false

[dependencies]
sdl2 = "0.38.0"
serde = { version = "1", features = ["derive"] }
rodio = "0.20"
toml = "0.8"
rand = "0.10.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
criterion = "0.5"
